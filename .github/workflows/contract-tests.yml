name: Web Frontend Contract Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  npm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Initialize Specmatic License and Download Specmatic Enterprise
        run: |
          mkdir -p ~/.specmatic
          echo "${{ secrets.SPECMATIC_LICENSE_KEY }}" > ~/.specmatic/specmatic-license.txt
          curl -fsSL https://docs.specmatic.io/install-specmatic-enterprise.sh | bash

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run frontend tests
        env:
          SPECMATIC_CI: "true"
          SPECMATIC_REPO_ID: ${{ github.repository_id }}
          SPECMATIC_REPO_NAME: ${{ github.event.repository.name }}
          SPECMATIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SPECMATIC_BUILD_ID: ${{ github.run_id }}
          SPECMATIC_RUN_ATTEMPT: ${{ github.run_attempt }}
          SPECMATIC_BRANCH_NAME: ${{ github.ref_name }}
        run: |
          npm ci
          npm test
