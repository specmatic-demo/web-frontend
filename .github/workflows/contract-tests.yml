name: Web Frontend Contract Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  npm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run frontend tests
        run: npm test

  specmatic:
    uses: specmatic-demo/.github/.github/workflows/specmatic-reports.yml@main
    secrets: inherit
